data:
  train_data: 'features_train_1.h5'  #  !!!
  train_data_length: 400 # 399 for train_1
  val_data: 'features_val.h5'
  val_data_length: 100
  size: 96

                    
hardware:
  num_workers: 8
  gpus: [1]     
  ddp: True        


training:
  max_epochs: 1000
  check_val: 10 #
  model: 'DenseNet121' #, 'DenseNet121', 'EfficientNetBN', 'ConvNeXt' 
  out_channels: 32 # 32 if moab, 3 if concat; 48 if foaa
  foaa_channels: 30 # should be less than out_channels
  dropout: 0.1
  fc_channels: 512 # 512
  activation: 'sigmoid'
  loss: 'BCELogits'  #'BCE', 'BCELogits'
  merging: 'MOAB' # 'concat', 'MOAB' , 'FOAA'
  batch: 100
  optimizer:
    name: 'adam'  #  adam, sgd
    params:
      lr: 0.00000004 #0.0000004 
      weight_decay: 0.000001 

